<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/components/login/style.css" />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <div class="login-card">
        <h2 id="formTitle">Login</h2>

        <form id="loginForm">
          <div class="input-group">
            <label>Username or Email</label>
            <input
              type="text"
              id="loginUsername"
              placeholder="Enter Username or Email"
            />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter Password"
            />
          </div>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="#" class="forgot" onclick="forgotPassword()"
          >Forgot password?</a
        >

        <p class="new-user">New user?</p>
        <button class="signup-btn" onclick="showSignup()">Signup Now</button>

        <form id="signupForm" style="display: none">
          <div class="input-group">
            <label>Full Name</label>
            <input
              type="text"
              id="signupFullname"
              placeholder="Enter Full Name"
            />
          </div>

          <div class="input-group">
            <label>Username</label>
            <input
              type="text"
              id="signupUsername"
              placeholder="Enter Username"
            />
          </div>

          <div class="input-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter Email" />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input
              type="password"
              id="signupPassword"
              placeholder="Enter Password"
            />
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <input
              type="password"
              id="signupConfirmPassword"
              placeholder="Confirm Password"
            />
          </div>

          <button type="submit" class="login-btn">Create Account</button>
        </form>

        <p class="signup-with">May also signup with</p>

        <div class="social-icons">
          <i class="fab fa-facebook-f"></i>
          <i class="fab fa-twitter"></i>
          <i class="fab fa-linkedin-in"></i>
        </div>
      </div>
    </div>
    <script src="/src/components/login/script.js"></script>
  </body>
</html>
