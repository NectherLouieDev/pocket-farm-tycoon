<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed Shop</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Background page (optional later for your game screen) -->
  <div class="app-background"></div>

  <!-- Seed shop panel -->
  <div class="shop-modal">

    <div class="shop-panel">

      <!-- Header -->
      <div class="shop-header">
        <h2>Seed Shop</h2>
        <button class="close-btn" aria-label="Close">✕</button>
      </div>

      <!-- Top status (coins + inventory like your prototype) -->
      <div class="shop-status">
        <div>Coins: <span id="coins">100</span></div>
        <div>Inventory: <span id="inventory">0</span> seeds</div>
      </div>

      <!-- Items list (cards go here) -->
      <div class="shop-list" id="shopGrid">
        <!-- JS will insert shop cards here -->
      </div>

    </div>

  </div>

  <footer>
    Minimal Seed Shop Prototype
  </footer>

  <script src="./script.js"></script>
  <script type="module" src="../../utils/navigationLoader.js"></script>

</body>
</html>
